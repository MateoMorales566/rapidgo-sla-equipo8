name: CI RapidGo

run-name: CI ejecutado por ${{ github.actor }}

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-python:
    name: Sintaxis, contrato y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall -q producer spark sla tests

      - name: Validar contrato JSON y eventos de muestra
        run: |
          python -m sla.contract \
            samples/sla_event.json \
            producer/sla_event_sample.json \
            producer/sla_events_batch.json

      - name: Ejecutar pruebas
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pytest
          path: reports/junit.xml
          if-no-files-found: warn

  validar-configuracion:
    name: Docker Compose y archivos del proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Validar docker-compose
        run: docker compose config --quiet

      - name: Validar JSON del contrato
        run: python -c "import json; json.load(open('docs/contrato_evento.json', encoding='utf-8'))"

      - name: Verificar estructura mínima
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f requirements.txt
          test -d .github/workflows
          test -d producer
          test -d spark
          test -d tests
          test -d datalake/raw
          test -d datalake/processed
          test -d datalake/curated
