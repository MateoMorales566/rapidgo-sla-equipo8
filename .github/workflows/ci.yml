name: CI RapidGo

run-name: CI ejecutado por ${{ github.actor }}

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad-codigo:
    name: Sintaxis, contrato y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall -q producer spark sla semana3 airflow/dags tests

      - name: Validar contrato JSON y eventos de muestra
        run: |
          python -m sla.contract \
            samples/sla_event.json \
            producer/sla_event_sample.json \
            producer/sla_events_batch.json

      - name: Ejecutar pruebas
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pytest
          path: reports/junit.xml
          if-no-files-found: warn

  dag-airflow:
    name: DAG Airflow (importación, ejecución y recuperación)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/reports/airflow-home
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: ${{ github.workspace }}/reports/airflow-logs
      PYTHONPATH: ${{ github.workspace }}
      RAPIDGO_DATALAKE: ${{ github.workspace }}/reports/ci-datalake
      RAPIDGO_REPORTS: ${{ github.workspace }}/reports/ci-reports
      RAPIDGO_FLAGS: ${{ github.workspace }}/reports/ci-flags
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python para Airflow
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Airflow y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-airflow.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt"
          pip install -r requirements.txt
          airflow version

      - name: Generar Data Lake de prueba
        run: |
          python -m semana3.sample_data \
            --input producer/sla_events_batch.json \
            --output reports/ci-datalake \
            --overwrite

      - name: Validar importación y estructura del DAG
        run: |
          python - <<'PY'
          from airflow.models.dagbag import DagBag

          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors

          dag = bag.dags.get("rapidgo_sla_semana3")
          assert dag is not None, "El DAG rapidgo_sla_semana3 no se importó"
          assert len(dag.tasks) == 6, f"Se esperaban 6 tareas, hay {len(dag.tasks)}"
          assert dag.default_args["retries"] == 2
          assert dag.schedule_interval is None
          print("DAG validado:", dag.dag_id, len(dag.tasks), "tasks")
          print("Tareas:", ", ".join(sorted(task.task_id for task in dag.tasks)))
          PY

      - name: Inicializar base de datos de Airflow
        run: airflow db migrate

      - name: Ejecutar DAG completo
        run: airflow dags test rapidgo_sla_semana3 2026-11-01

      - name: Fallo controlado del quality gate
        run: |
          mkdir -p reports/ci-flags
          touch reports/ci-flags/forzar_fallo_calidad
          set +e
          airflow dags test rapidgo_sla_semana3 2026-11-06 > reports/fallo_controlado.log 2>&1
          status=$?
          set -e
          echo "Código de salida del run fallido: $status"
          if [ "$status" -eq 0 ]; then
            echo "ERROR: el DAG debió fallar con la bandera activa"
            exit 1
          fi
          grep -q "FALLO_CONTROLADO" reports/fallo_controlado.log
          grep -q "forzar_fallo_calidad" reports/fallo_controlado.log
          airflow tasks states-for-dag-run rapidgo_sla_semana3 \
            "manual__2026-11-06T00:00:00-05:00" | tee reports/estados_fallo.log
          grep -q "validar_calidad.*failed" reports/estados_fallo.log
          grep -q "calcular_indicadores.*upstream_failed" reports/estados_fallo.log
          grep -q "publicar_resultado.*upstream_failed" reports/estados_fallo.log
          rm -f reports/ci-flags/forzar_fallo_calidad
          echo "Fallo controlado verificado; tareas aguas abajo bloqueadas"

      - name: Recuperación tras eliminar la bandera
        run: |
          airflow dags test rapidgo_sla_semana3 2026-11-07
          test -f reports/ci-reports/sla_semana3_latest.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/ci-reports/sla_semana3_latest.json").read_text(encoding="utf-8")
          )
          assert report["quality"]["passed"] is True
          assert report["metrics"]["pedidos_unicos"] > 0
          print("Reporte recuperado:", report["metrics"])
          PY

      - name: Publicar reporte y logs del DAG
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-airflow
          path: |
            reports/ci-reports/
            reports/airflow-logs/
            reports/fallo_controlado.log
          if-no-files-found: warn

  validar-configuracion:
    name: Docker Compose y archivos del proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Validar docker-compose base y Semana 3
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.semana3.yml config --quiet

      - name: Validar JSON del contrato
        run: python -c "import json; json.load(open('docs/contrato_evento.json', encoding='utf-8'))"

      - name: Verificar estructura mínima
        run: |
          test -f README.md
          test -f docker-compose.yml
          test -f docker-compose.semana3.yml
          test -f requirements.txt
          test -f requirements-airflow.txt
          test -f airflow/dags/rapidgo_sla_orchestration.py
          test -f docs/checkpoints/semana1.md
          test -f docs/checkpoints/semana2.md
          test -f docs/checkpoints/semana3.md
          test -f docs/decisions/ADR-001-kafka-sla.md
          test -f docs/decisions/ADR-002-ventana-watermark-checkpoints.md
          test -f docs/decisions/ADR-003-orquestacion-y-recuperacion.md
          test -d .github/workflows
          test -d airflow/flags
          test -d producer
          test -d spark
          test -d semana3
          test -d tests
          test -d datalake/raw
          test -d datalake/processed
          test -d datalake/curated
          
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests airflow scripts
      - name: Ejecutar pruebas
        run: pytest -v
      - name: Validar Docker Compose
        run: docker compose config --quiet
      - name: Quality Gate
        run: python scripts/quality_gate.py
