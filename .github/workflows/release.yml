name: Release RapidGo

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ej. v0.2.0-streaming)"
        required: true

permissions:
  contents: write

jobs:
  publicar-release:
    name: Publicar GitHub Release
    runs-on: ubuntu-latest
    steps:
    
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Quality Gate previo al release
        run: |
          python -m compileall -q producer spark sla airflow/dags tests scripts
          pytest -q
          python scripts/quality_gate.py
          mkdir -p reports
          zip -r reports/rapidgo-sla-equipo8.zip . \
            -x ".git/*" "datalake/*" "reports/*" "*.pdf" "**/__pycache__/*" \
               ".pytest_cache/*" ".venv/*"

      - name: Crear release con notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe"
          else
            gh release create "$TAG" \
              --title "RapidGo SLA $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" reports/rapidgo-sla-equipo8.zip --clobber
