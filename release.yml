name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            **Fecha:** ${{ github.event.head_commit.committer.date }}

            **Cambios principales:**
            - Estructura de proyecto Base (Semana 1)
            - Pipeline Kafka + Spark (Semana 2)
            - KPIs y alertas SLA
            - GitHub Actions configurados

            ---
            *Evidencia viva en GitHub Actions checks*