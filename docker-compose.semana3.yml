# Overlay de Semana 3: Airflow para el DAG batch de calidad y reporte.
# Se usa junto al compose base:
#   docker compose -f docker-compose.yml -f docker-compose.semana3.yml up -d --build airflow
#
# Solo necesita la capa `processed` que produce Spark streaming; no vuelve a
# escribir Parquet ni toca los checkpoints del job de streaming.

name: rapidgo-sla-equipo8

services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: rapidgo-airflow:2.9.3
    hostname: airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Bogota
      # Valores SOLO para la demo local; no reutilizar en producción.
      AIRFLOW__CORE__FERNET_KEY: "0cZfhzsL6byjkPFXY_pSkmbWTuiigSIBIjvQjudIFfE="
      AIRFLOW__WEBSERVER__SECRET_KEY: "rapidgo-equipo8-demo"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: RapidGo
      _AIRFLOW_WWW_USER_LASTNAME: Equipo8
      _AIRFLOW_WWW_USER_EMAIL: equipo8@example.com
      _AIRFLOW_WWW_USER_ROLE: Admin
      PYTHONPATH: /opt/rapidgo
      RAPIDGO_DATALAKE: /opt/rapidgo/datalake
      RAPIDGO_REPORTS: /opt/airflow/reports
      RAPIDGO_FLAGS: /opt/airflow/flags
      RAPIDGO_MAX_INVALID_RATIO: "0"
      TZ: America/Bogota
    ports:
      - "8088:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/flags:/opt/airflow/flags
      - ./reports:/opt/airflow/reports
      - ./datalake:/opt/rapidgo/datalake:ro
      - ./semana3:/opt/rapidgo/semana3:ro
      - ./sla:/opt/rapidgo/sla:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped
